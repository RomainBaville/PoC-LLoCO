name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v1

    - name: Install dependencies
      run: uv sync --extra dev --frozen

    - name: Set PYTHONPATH
      shell: bash
      run: echo "PYTHONPATH=." >> $GITHUB_ENV

    - name: Ruff
      run: uv run ruff check .

    - name: MyPy
      run: uv run mypy .

    - name: Tests
      run: uv run pytest
