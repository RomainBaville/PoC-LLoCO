repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy

  - repo: https://github.com/google/yapf
    rev: v0.40.2
    hooks:
      - id: yapf

  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv.lock updated
        entry: bash -c "uv lock --check"
        language: system
